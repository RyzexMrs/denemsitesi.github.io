<!DOCTYPE html>
<html lang="az">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Barışağ balam?</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      /* Çiçekli arka plan */
      background-color: #ffe6f0;
      background-image: radial-gradient(#ffb6c1 2px, transparent 2px), radial-gradient(#ffb6c1 2px, #ffe6f0 2px);
      background-size: 80px 80px;
      background-position: 0 0, 40px 40px;
      overflow: hidden;
      position: relative;
    }

    /* Neon Işıklı Mod Menü */
    .mod-menu {
      position: relative;
      width: 360px;
      padding: 30px 20px;
      background: #1b4332; /* Derin ve güzel yeşil tonu */
      border-radius: 20px;
      text-align: center;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
      border: 3px solid transparent;
      animation: neonBorder 4s linear infinite;
      z-index: 10;
    }

    /* Kenarlardan geçen renkli neon ışık animasyonu */
    @keyframes neonBorder {
      0% {
        border-color: #ff0055;
        box-shadow: 0 0 15px #ff0055, inset 0 0 10px #ff0055;
      }
      33% {
        border-color: #00e5ff;
        box-shadow: 0 0 15px #00e5ff, inset 0 0 10px #00e5ff;
      }
      66% {
        border-color: #ffea00;
        box-shadow: 0 0 15px #ffea00, inset 0 0 10px #ffea00;
      }
      100% {
        border-color: #ff0055;
        box-shadow: 0 0 15px #ff0055, inset 0 0 10px #ff0055;
      }
    }

    /* Menü içi elemanlar */
    .pony-img, .bear-img {
      width: 100px;
      height: 100px;
      object-fit: contain;
      margin-bottom: 10px;
    }

    .question {
      color: #ffffff;
      font-size: 24px;
      font-weight: bold;
      margin-bottom: 25px;
      text-shadow: 0 2px 4px rgba(0,0,0,0.5);
    }

    .btn-container {
      display: flex;
      justify-content: center;
      gap: 20px;
    }

    button {
      padding: 12px 30px;
      font-size: 18px;
      font-weight: bold;
      border: none;
      border-radius: 12px;
      cursor: pointer;
      transition: transform 0.2s, background-color 0.2s;
    }

    button:hover {
      transform: scale(1.05);
    }

    .btn-he {
      background-color: #2ec4b6;
      color: white;
    }

    .btn-yox {
      background-color: #e63946;
      color: white;
    }

    .btn-back {
      background-color: #ff9f1c;
      color: white;
      margin-top: 15px;
    }

    /* Defter Tasarımı ("Hə" Yanıtı için) */
    .notebook {
      background: #fff0f5;
      border: 3px dashed #ff69b4;
      border-radius: 15px;
      padding: 20px;
      margin-top: 10px;
      box-shadow: inset 0 0 10px rgba(255, 105, 180, 0.2);
    }

    .notebook p {
      color: #d63384;
      font-size: 19px;
      font-weight: 600;
      line-height: 1.5;
    }

    .no-message {
      color: #ffffff;
      font-size: 17px;
      line-height: 1.5;
      margin-bottom: 15px;
    }

    /* Sürekli Yükselen Kalpler */
    .heart {
      position: absolute;
      bottom: -50px;
      font-size: 24px;
      user-select: none;
      pointer-events: none;
      animation: floatUp linear infinite;
      z-index: 1;
    }

    @keyframes floatUp {
      0% {
        transform: translateY(0) scale(0.8);
        opacity: 1;
      }
      100% {
        transform: translateY(-105vh) scale(1.3);
        opacity: 0;
      }
    }

    .hidden {
      display: none !important;
    }
  </style>
</head>
<body>

  <!-- Mod Menü -->
  <div class="mod-menu">
    
    <!-- Ana Ekran -->
    <div id="main-screen">
      <!-- Tatlı Pony Görseli -->
      <img class="pony-img" src="https://cdn-icons-png.flaticon.com/512/3468/3468081.png" alt="Pony">
      <div class="question">Barışağ balam ?</div>
      <div class="btn-container">
        <button class="btn-he" onclick="selectHe()">Hə</button>
        <button class="btn-yox" onclick="selectYox()">Yox</button>
      </div>
    </div>

    <!-- "Hə" Seçeneği Ekranı -->
    <div id="he-screen" class="hidden">
      <div class="notebook">
        <img class="pony-img" src="https://cdn-icons-png.flaticon.com/512/3468/3468081.png" alt="Pony" style="width: 70px; height: 70px;">
        <p>Birdə heçvaxt səni incitməyəcəyimə söz verirəm 🤍</p>
      </div>
    </div>

    <!-- "Yox" Seçeneği Ekranı -->
    <div id="yox-screen" class="hidden">
      <!-- Üzgün Ayıcık Görseli -->
      <img class="bear-img" src="https://cdn-icons-png.flaticon.com/512/2977/2977285.png" alt="Üzgün Ayıcık">
      <div class="no-message">
        Birdə heçvaxt xətrinə dəyməyəcəm heçvaxt incitməycəm əvvəlki kimi olacıyığ yene söz 🤍
      </div>
      <button class="btn-back" onclick="goBack()">Geri dön</button>
    </div>

  </div>

  <script>
    let heartInterval = null;

    function selectHe() {
      document.getElementById('main-screen').classList.add('hidden');
      document.getElementById('he-screen').classList.remove('hidden');
      startHearts();
    }

    function selectYox() {
      document.getElementById('main-screen').classList.add('hidden');
      document.getElementById('yox-screen').classList.remove('hidden');
      stopHearts();
    }

    function goBack() {
      document.getElementById('yox-screen').classList.add('hidden');
      document.getElementById('main-screen').classList.remove('hidden');
    }

    // Renkli Sürekli Kalp Yağmuru
    function startHearts() {
      if (heartInterval) return;
      
      const colors = ['💖', '🔴', '💙', '💛', '💜', '💚', '🤍', '🧡'];
      
      heartInterval = setInterval(() => {
        const heart = document.createElement('div');
        heart.classList.add('heart');
        
        // Rastgele renkli kalp simgesi seçimi
        heart.innerText = colors[Math.floor(Math.random() * colors.length)];
        
        // Rastgele yatay konum ve hız
        heart.style.left = Math.random() * 100 + 'vw';
        heart.style.animationDuration = (Math.random() * 2 + 3) + 's';
        heart.style.fontSize = (Math.random() * 15 + 20) + 'px';
        
        document.body.appendChild(heart);
        
        // Ekrana sığmayan eski kalpleri temizle
        setTimeout(() => {
          heart.remove();
        }, 5000);
      }, 200);
    }

    function stopHearts() {
      clearInterval(heartInterval);
      heartInterval = null;
      document.querySelectorAll('.heart').forEach(h => h.remove());
    }
  </script>
</body>
</html>
